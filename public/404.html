    <script>
      // GitHub Pages SPA fallback: preserve the requested path through a query param,
      // which src/lib/router.jsx restores before first paint.
      var path = window.location.pathname + window.location.hash
      window.location.replace(window.location.origin + '/?p=' + encodeURIComponent(path))
    </script>
  </head>
